name: Native transport regression tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S third_party/airplay2-sender-cpp -B build/native -DCMAKE_BUILD_TYPE=Release -DAIRPLAY_BUILD_EXAMPLE=OFF -DAIRPLAY_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/native --parallel 4
      - name: Protocol, codec, timing and socket tests
        run: ctest --test-dir build/native --output-on-failure
